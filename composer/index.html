<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMPOSER — spectral cabinet</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/chrome.css" />
  </head>
  <body>
    <div id="fallback" class="fallback hidden" role="alert">
      <p class="fallback-title">COMPOSER</p>
      <p class="fallback-msg">WebGL2 is required for the spectral field.</p>
    </div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="overlay" class="overlay">
      <header class="veil" id="veil">
        <h1 class="wordmark">COMPOSER</h1>
        <p class="subline">spectral cabinet</p>
        <button type="button" class="enter" id="enter">enter</button>
      </header>
      <aside class="hud" id="hud" aria-live="polite">
        <span class="hud-brand">composer</span>
        <span class="hud-mode" id="mode-label">ink</span>
        <span class="hud-hint">scroll · 1–5 · space · h</span>
      </aside>
      <button type="button" class="listen" id="listen" aria-pressed="false">
        listen
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
